<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>衛生管理者 問題集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
:root{
  --ground:#F3F4F6; --surface:#FFFFFF; --ink:#1B2230; --muted:#5E6676; --line:#D9DCE3;
  --accent:#24508C; --accent-ink:#FFFFFF; --accent-soft:#E3EAF4;
  --ok:#2C6B4F; --ok-soft:#E1EFE8; --ng:#B23A2E; --ng-soft:#F8E4E1;
  --body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --display:"Zen Kaku Gothic New","BIZ UDPGothic","Hiragino Sans",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#11151C; --surface:#1A202A; --ink:#E6E9EF; --muted:#9AA3B2; --line:#2D3542;
    --accent:#8DB3EA; --accent-ink:#0E1420; --accent-soft:#1F2C40;
    --ok:#7CC4A0; --ok-soft:#1C3328; --ng:#EE8E80; --ng-soft:#3B2420; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#11151C; --surface:#1A202A; --ink:#E6E9EF; --muted:#9AA3B2; --line:#2D3542;
  --accent:#8DB3EA; --accent-ink:#0E1420; --accent-soft:#1F2C40;
  --ok:#7CC4A0; --ok-soft:#1C3328; --ng:#EE8E80; --ng-soft:#3B2420; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;padding:0 16px}
.wrap{max-width:680px;margin:0 auto;padding-block:20px 120px}
header{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
h1{font-family:var(--display);font-weight:900;font-size:26px;line-height:1.3;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:18px;margin:22px 0 8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h2 span{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:400}
.rule{font-size:14px;color:var(--muted);margin:0}
.rule b{color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card .t{font-weight:700;font-size:17px}
.meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:1px 10px}
.pill.pass{background:var(--ok-soft);color:var(--ok)}
.pill.fail{background:var(--ng-soft);color:var(--ng)}
button,.btn{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;display:inline-block;line-height:1.4}
button.sub,.btn.sub{background:transparent;color:var(--accent);border:1px solid var(--line)}
button.warn{background:var(--ng);color:#fff}
button:focus-visible,.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.note{border-color:var(--ng);background:var(--ng-soft)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);display:flex;gap:6px;padding-block:10px;overflow-x:auto;margin:0 -16px;padding-inline:16px}
nav a{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;padding:5px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);text-decoration:none;font-weight:700;font-size:13px;line-height:1.3;min-width:62px}
nav a small{font-weight:400;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
nav a.done{border-color:var(--accent);background:var(--accent-soft)}
section{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 70px)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.qhead{display:flex;gap:10px;align-items:flex-start}
.num{font-family:var(--display);font-weight:900;font-size:14px;color:var(--accent);min-width:38px;font-variant-numeric:tabular-nums;white-space:nowrap}
.qtext{margin:0;flex:1}
.choices{display:flex;flex-direction:column;gap:6px}
.choices label{position:relative;display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;background:var(--ground);font-size:15px;line-height:1.6}
.choices .no{font-weight:700;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.choices input{position:absolute;opacity:0;pointer-events:none}
.choices label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choices label:has(input:checked) .no{color:var(--accent)}
.choices label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:10}
.bar-in{max-width:680px;margin:0 auto;display:flex;gap:12px;align-items:center}
.count{flex:1;font-size:13px;color:var(--muted);line-height:1.45;font-variant-numeric:tabular-nums}
.count b{font-size:20px;color:var(--ink)}
.bar button{font-size:16px;padding:12px 20px}
.scorecard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.score{font-family:var(--display);font-weight:900;font-size:60px;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:20px;color:var(--muted);font-weight:700}
.verdict{font-weight:700;font-size:17px;padding:4px 12px;border-radius:999px}
.verdict.pass{background:var(--ok-soft);color:var(--ok)}
.verdict.fail{background:var(--ng-soft);color:var(--ng)}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
tr:last-child td{border-bottom:0}
th{font-size:12px;color:var(--muted);font-weight:400}
td.r{text-align:right;white-space:nowrap}
td small{color:var(--muted)}
.meter{height:6px;background:var(--line);border-radius:3px;position:relative;margin-top:4px;min-width:60px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--ok)}
.meter.ng i{background:var(--ng)}
.meter b{position:absolute;left:40%;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.ok{color:var(--ok);font-weight:700}.ng{color:var(--ng);font-weight:700}
.wrong{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.wrong .tag{font-size:12px;color:var(--muted)}
.wrong .you{color:var(--ng);font-size:14px}
.wrong .ans{color:var(--ok);font-weight:700;font-size:14px}
.wrong .exp{font-size:14px;line-height:1.75;background:var(--accent-soft);border-radius:8px;padding:9px 11px;margin-top:3px}
.wrong .exp b{color:var(--accent)}
details{margin-top:12px}
summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:15px;padding:6px 0}
.center{padding:40px 0;text-align:center;color:var(--muted)}
.hist{display:flex;gap:6px;flex-wrap:wrap}
.hist span{font-size:12px;border:1px solid var(--line);border-radius:8px;padding:2px 8px;background:var(--surface);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
html{scroll-behavior:smooth}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="center">読みこんでいます…</p></div>
<div class="bar" id="bar" hidden>
  <div class="bar-in">
    <div class="count"><b id="cnt">0</b> / <span id="tot">44</span> 問<br><span id="hint">経過 0:00</span></div>
    <button id="grade" type="button">採点する</button>
  </div>
</div>

<script>
const R=[
  {n:"関係法令",s:"有害業務",short:"法令・有害",p:8},
  {n:"労働衛生",s:"有害業務",short:"衛生・有害",p:8},
  {n:"関係法令",s:"有害業務以外",short:"法令",p:10},
  {n:"労働衛生",s:"有害業務以外",short:"衛生",p:10},
  {n:"労働生理",s:"",short:"生理",p:10}
];
const RAW="https://raw.githubusercontent.com/lomolabo-sys/drill/main/eisei/";
const app=document.getElementById("app"), bar=document.getElementById("bar");
let SETS=[], cache={}, cur=null, armed=false, timer=null;

function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function rng(seed){let h=2166136261;for(const ch of seed){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%10000)/10000}}
function order(seed,n){const r=rng(seed),a=[...Array(n).keys()];for(let k=n-1;k>0;k--){const j=Math.floor(r()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function rname(r){return R[r].s?`${R[r].n}（${R[r].s}）`:R[r].n}
function md(t){const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()}`}
function hms(ms){const s=Math.max(0,Math.floor(ms/1000));return `${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`}

async function getJSON(name){
  const get=async u=>{const r=await fetch(u+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;return r.json()};
  const got=await Promise.allSettled([get(RAW+name),get(name)]);
  const ok=got.filter(g=>g.status==="fulfilled"&&g.value).map(g=>g.value);
  if(!ok.length)throw new Error("load");
  return ok.sort((a,b)=>(b.v||0)-(a.v||0))[0];
}
async function loadSet(id){
  if(cache[id])return cache[id];
  const s=SETS.find(x=>x.id===id); if(!s)throw new Error("noset");
  return cache[id]=await getJSON(s.file);
}
function setTitle(id){const s=SETS.find(x=>x.id===id);return s?s.title:id}

/* ---------- routing ---------- */
async function route(){
  clearInterval(timer); bar.hidden=true; armed=false;
  const [,v,id]=(location.hash||"#/").split("/");
  try{
    if(v==="q")await quiz(id);
    else if(v==="r")await result(id);
    else home();
  }catch(e){app.innerHTML='<p class="center">問題を読みこめませんでした。電波のいい所で開き直してください。</p>'}
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
app.addEventListener("change",e=>onPick(e));

/* ---------- daily ---------- */
let DAILY=null;
async function loadDaily(){if(DAILY)return DAILY;try{DAILY=await getJSON("daily.json")}catch(e){DAILY=null}return DAILY}
function fmtDay(d){const [y,m,dd]=d.split("-").map(Number);return `${m}月${dd}日（${"日月火水木金土"[new Date(y,m-1,dd).getDay()]}）`}
function shortDay(d){const [,m,dd]=d.split("-").map(Number);return `${m}/${dd}`}
function streak(dh){
  const d=new Date(); if(!dh[ymd(d)])d.setDate(d.getDate()-1);
  let n=0; while(dh[ymd(d)]){n++;d.setDate(d.getDate()-1)}
  return n;
}
function ymd(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}

/* ---------- note ---------- */
function noteKeys(){
  const n=store("eisei-note")||{};
  const mk=Object.entries(n).flatMap(([id,arr])=>SETS.some(s=>s.id===id)?arr.map(i=>id+":"+i):[]);
  return mk.concat(Object.keys(store("eisei-dnote")||{}));
}
function labelOf(key,inReview){
  const p=key.split(":");
  if(p[0]==="d")return inReview?`${shortDay(p[1])}の問題 ${+p[2]+1}`:`問${+p[2]+1}`;
  return inReview?`${setTitle(p[0]).replace("模試 ","")} 問${+p[1]+1}`:`問${+p[1]+1}`;
}
async function qOf(key){
  const p=key.split(":");
  if(p[0]==="d"){const dn=store("eisei-dnote")||{};if(dn[key])return dn[key];const d=await loadDaily();return d&&d.date===p[1]?d.questions[+p[2]]:null}
  const d=await loadSet(p[0]);return d.questions[+p[1]];
}

/* ---------- home ---------- */
async function home(){
  const nk=noteKeys(), daily=await loadDaily();
  const dh=store("eisei-dhist")||{};
  let h=`<header><span class="eyebrow">第一種衛生管理者</span><h1>衛生管理者 問題集</h1>
  <p class="rule">本番の合格ライン：<b>5つの範囲すべてで40%以上</b>、かつ<b>合計60%以上</b>。</p></header>`;
  if(daily){
    const res=store("eisei-res-daily"), done=res&&res.date===daily.date, dr=store("eisei-draft-daily");
    const st=streak(dh);
    h+=`<div class="card"><div class="row"><span class="t">今日の${daily.questions.length}問</span><span class="meta">${fmtDay(daily.date)}</span>`;
    if(done)h+=`<span class="pill ${res.c/res.n>=0.6?"pass":"fail"}">${res.c}/${res.n} 正解</span>`;
    h+=`</div><span class="meta">${done?"今日の分は解き終わりました。":"毎朝5時半ごろ新しい問題に変わります。"}${st?`　連続 ${st}日`:""}</span>`;
    const last=Object.keys(dh).sort().slice(-7);
    if(last.length)h+=`<div class="hist">${last.map(d=>`<span>${shortDay(d)}　${dh[d].c}/${dh[d].n}</span>`).join("")}</div>`;
    h+=`<div class="row">`;
    if(!done&&dr&&dr.date===daily.date&&Object.keys(dr.ans||{}).length)h+=`<a class="btn" href="#/q/daily">続きから（${Object.keys(dr.ans).length}問回答済み）</a>`;
    else if(!done)h+=`<a class="btn" href="#/q/daily" data-new="daily">今日の問題を解く</a>`;
    else h+=`<a class="btn" href="#/r/daily">結果と解説</a><a class="btn sub" href="#/q/daily" data-new="daily">もう一度解く</a>`;
    h+=`</div></div>`;
  }
  if(nk.length)h+=`<div class="card note"><div class="t">まちがいノート　${nk.length}問</div><span class="meta">今日の問題と模試で間違えた問題です。正解すると消えます。</span><div class="row"><a class="btn" href="#/q/review" data-new="review">まちがいだけ解き直す</a></div></div>`;
  h+=`<h2>模試<span>本試験形式　44問・3時間</span></h2>`;
  SETS.forEach(s=>{
    const res=store("eisei-res-"+s.id), dr=store("eisei-draft-"+s.id), hist=store("eisei-hist-"+s.id)||[];
    h+=`<div class="card"><div class="row"><span class="t">${esc(s.title)}</span>`;
    if(res)h+=`<span class="pill ${res.pass?"pass":"fail"}">${res.pass?"合格":"不合格"}</span>`;
    h+=`</div>`;
    if(res){const best=Math.max(...hist.map(x=>x.pts),res.pts);h+=`<span class="meta">前回 ${res.pts}点（${md(res.at)}）　最高 ${best}点　受験 ${hist.length}回</span>`}
    else h+=`<span class="meta">まだ解いていません</span>`;
    h+=`<div class="row">`;
    if(dr&&Object.keys(dr.ans||{}).length)h+=`<a class="btn" href="#/q/${s.id}">続きから（${Object.keys(dr.ans).length}問回答済み）</a><button class="sub" data-restart="${s.id}">最初から</button>`;
    else h+=`<a class="btn" href="#/q/${s.id}" data-new="${s.id}">${res?"もう一度解く":"解く"}</a>`;
    if(res)h+=`<a class="btn sub" href="#/r/${s.id}">前回の結果と解説</a>`;
    h+=`</div></div>`;
  });
  h+=`<p class="rule">模試の配点は有害業務の2範囲が1問8点、ほかは1問10点。選択肢の並びは解くたびに入れ替わります。記録はこの端末のブラウザに保存されます。</p>`;
  app.innerHTML=h;
  app.querySelectorAll("[data-restart]").forEach(b=>b.onclick=()=>{store("eisei-draft-"+b.dataset.restart,null);location.hash="#/q/"+b.dataset.restart});
  app.querySelectorAll("[data-new]").forEach(a=>a.onclick=()=>store("eisei-draft-"+a.dataset.new,null));
}

/* ---------- build items ---------- */
async function itemsFor(id,draft){
  if(id==="review"){
    const keys=draft&&draft.items?draft.items:noteKeys();
    const out=[];
    for(const k of keys){const q=await qOf(k);if(q)out.push({key:k,q,label:labelOf(k,true)})}
    return out.sort((a,b)=>a.q.r-b.q.r);
  }
  if(id==="daily"){
    const d=await loadDaily(); if(!d)throw new Error("nodaily");
    return d.questions.map((q,i)=>{const k=`d:${d.date}:${i}`;return {key:k,q,label:labelOf(k)}});
  }
  const d=await loadSet(id);
  return d.questions.map((q,i)=>({key:id+":"+i,q,label:`問${i+1}`}));
}

/* ---------- quiz ---------- */
async function quiz(id){
  const dk="eisei-draft-"+id;
  let draft=store(dk);
  const daily=id==="daily"?await loadDaily():null;
  if(draft&&daily&&draft.date!==daily.date)draft=null;
  if(!draft){
    const t=(store("eisei-try-"+id)||0)+1; store("eisei-try-"+id,t);
    draft={start:Date.now(),try:t,ans:{}};
    if(daily)draft.date=daily.date;
    if(id==="review"){draft.items=noteKeys();if(!draft.items.length){location.hash="#/";return}}
    store(dk,draft);
  }
  const items=await itemsFor(id,draft);
  cur={id,items,draft,dk};
  const title=id==="review"?"まちがいノート":id==="daily"?`今日の${items.length}問`:setTitle(id);
  const eye=id==="review"?"解き直し":id==="daily"?fmtDay(daily.date):"本試験形式";
  const rule=id==="review"?"正解した問題はノートから消えます。":id==="daily"?"間違えた問題は、まちがいノートに入ります。":"5つの範囲すべてで40%以上、合計60%以上で合格。";
  let h=`<header><span class="eyebrow">${eye}</span><h1>${esc(title)}</h1>
  <p class="rule">${rule}　<a href="#/" style="color:var(--accent)">一覧へ戻る</a></p></header><nav>`;
  const used=R.map((_,r)=>items.some(it=>it.q.r===r));
  R.forEach((x,r)=>{if(used[r])h+=`<a href="#s${r}" data-r="${r}" onclick="event.preventDefault();document.getElementById('s${r}').scrollIntoView()">${x.short}<small>0/0</small></a>`});
  h+="</nav>";
  R.forEach((x,r)=>{
    const its=items.filter(it=>it.q.r===r); if(!its.length)return;
    h+=`<section id="s${r}"><h2>${rname(r)}<span>${its.length}問${id==="review"||id==="daily"?"":`・1問${x.p}点`}</span></h2>`;
    its.forEach(it=>{
      h+=`<div class="q"><div class="qhead"><span class="num">${esc(it.label)}</span><p class="qtext">${esc(it.q.q)}</p></div><div class="choices">`;
      const nm="k"+it.key.replace(/[^\w]/g,"_");
      order(it.key+"#"+draft.try,it.q.c.length).forEach((ci,pos)=>{
        h+=`<label><input type="radio" name="${nm}" value="${ci}" data-k="${it.key}" ${String(draft.ans[it.key])===String(ci)?"checked":""}><span class="no">(${pos+1})</span><span>${esc(it.q.c[ci])}</span></label>`;
      });
      h+=`</div></div>`;
    });
    h+=`</section>`;
  });
  app.innerHTML=h; bar.hidden=false;
  document.getElementById("tot").textContent=items.length;
  disarm(); update();
  const tick=()=>{document.getElementById("hint").textContent=`経過 ${hms(Date.now()-draft.start)}${SETS.some(s=>s.id===id)?" / 3:00:00":""}`};
  tick(); timer=setInterval(tick,1000);
}
function onPick(e){
  const t=e.target; if(!cur||t.type!=="radio")return;
  cur.draft.ans[t.dataset.k]=Number(t.value); store(cur.dk,cur.draft); disarm(); update();
}
function update(){
  if(!cur)return 0;
  let total=0;
  R.forEach((_,r)=>{
    const its=cur.items.filter(it=>it.q.r===r), c=its.filter(it=>cur.draft.ans[it.key]!==undefined).length; total+=c;
    const a=document.querySelector(`nav a[data-r="${r}"]`);
    if(a){a.querySelector("small").textContent=`${c}/${its.length}`;a.classList.toggle("done",c===its.length)}
  });
  document.getElementById("cnt").textContent=total;
  return total;
}
function disarm(){armed=false;const b=document.getElementById("grade");b.textContent="採点する";b.classList.remove("warn")}
document.getElementById("grade").addEventListener("click",()=>{
  if(!cur)return;
  const left=cur.items.length-update(), b=document.getElementById("grade");
  if(!armed){armed=true;b.textContent=left>0?`空欄${left}問のまま採点`:"採点を確定";b.classList.add("warn");return}
  grade();
});

function grade(){
  const {id,items,draft}=cur;
  const sec=R.map(()=>[0,0]), wrong=[], ans={}, qs={};
  items.forEach(it=>{
    const v=draft.ans[it.key]; ans[it.key]=v===undefined?null:v; qs[it.key]=it.q;
    sec[it.q.r][1]++;
    if(v===it.q.a)sec[it.q.r][0]++; else wrong.push(it.key);
  });
  const res={id,at:new Date().toISOString(),elapsed:Date.now()-draft.start,ans,wrong,sec,keys:items.map(it=>it.key),qs};
  const note=store("eisei-note")||{}, dnote=store("eisei-dnote")||{};
  if(id==="review"){
    const correct=new Set(items.map(it=>it.key).filter(k=>!wrong.includes(k)));
    for(const sid of Object.keys(note)){note[sid]=note[sid].filter(i=>!correct.has(sid+":"+i));if(!note[sid].length)delete note[sid]}
    for(const k of Object.keys(dnote))if(correct.has(k))delete dnote[k];
  }else if(id==="daily"){
    res.date=draft.date; res.c=items.length-wrong.length; res.n=items.length;
    items.forEach(it=>{if(wrong.includes(it.key))dnote[it.key]=it.q;else delete dnote[it.key]});
    const dh=store("eisei-dhist")||{};
    if(!dh[res.date]){dh[res.date]={c:res.c,n:res.n};const ks=Object.keys(dh).sort();while(ks.length>60)delete dh[ks.shift()];store("eisei-dhist",dh)}
  }else{
    res.pts=sec.reduce((s,[c],r)=>s+c*R[r].p,0);
    const max=sec.reduce((s,[,n],r)=>s+n*R[r].p,0);
    res.max=max; res.pass=sec.every(([c,n],r)=>c*R[r].p>=n*R[r].p*0.4)&&res.pts>=max*0.6;
    note[id]=wrong.map(k=>+k.split(":")[1]); if(!note[id].length)delete note[id];
    const hist=store("eisei-hist-"+id)||[]; hist.push({at:res.at,pts:res.pts,pass:res.pass}); store("eisei-hist-"+id,hist.slice(-20));
  }
  store("eisei-note",note); store("eisei-dnote",dnote);
  store("eisei-res-"+id,res);
  store(cur.dk,null); cur=null;
  location.hash="#/r/"+id;
}

/* ---------- result ---------- */
async function result(id){
  const res=store("eisei-res-"+id); if(!res){location.hash="#/";return}
  const items=[];
  for(const k of res.keys){const q=(res.qs&&res.qs[k])||await qOf(k);if(q)items.push({key:k,q,label:labelOf(k,id==="review")})}
  const byKey=Object.fromEntries(items.map(it=>[it.key,it]));
  const ok=items.length-res.wrong.length;
  let h;
  if(id==="review"){
    h=`<header><span class="eyebrow">まちがいノート 結果</span></header><div class="scorecard"><div class="score">${ok}<small> / ${items.length}問 正解</small></div>
    <span class="verdict ${res.wrong.length?"fail":"pass"}">${res.wrong.length?`あと${res.wrong.length}問がノートに残っています`:"ノートの問題をすべてクリア"}</span>
    <span class="meta">所要 ${hms(res.elapsed)}</span></div>`;
  }else if(id==="daily"){
    const rate=Math.round(ok/items.length*100);
    h=`<header><span class="eyebrow">${fmtDay(res.date)}の問題 結果</span></header><div class="scorecard"><div class="score">${ok}<small> / ${items.length}問 正解</small></div>
    <span class="verdict ${rate>=60?"pass":"fail"}">正答率 ${rate}%${rate>=60?"　本番の合格ペース":"　本番の60%に届かず"}</span>
    <span class="meta">所要 ${hms(res.elapsed)}</span></div><h2>範囲別</h2><table><tr><th>範囲</th><th class="r">正解</th></tr>`;
    res.sec.forEach(([c,n],r)=>{if(!n)return;const okr=c/n>=0.4;h+=`<tr><td>${rname(r)}<div class="meter ${okr?"":"ng"}"><i style="width:${c/n*100}%"></i><b></b></div></td><td class="r"><span class="${okr?"ok":"ng"}">${c}</span><small>/${n}</small></td></tr>`});
    h+=`</table>`;
  }else{
    h=`<header><span class="eyebrow">${esc(setTitle(id))} 結果　${md(res.at)}</span></header>
    <div class="scorecard"><div class="score">${res.pts}<small> / ${res.max}点</small></div>
    <span class="verdict ${res.pass?"pass":"fail"}">${res.pass?"合格ライン到達":"不合格"}</span>
    <span class="meta">正解 ${ok} / ${items.length}問　・　合格点 ${Math.ceil(res.max*0.6)}点　・　所要 ${hms(res.elapsed)}</span></div>
    <h2>範囲別<span>縦線が足切りの40%</span></h2><table><tr><th>範囲</th><th class="r">正解</th><th class="r">得点</th></tr>`;
    res.sec.forEach(([c,n],r)=>{
      const p=c*R[r].p, m=n*R[r].p, okr=p>=m*0.4;
      h+=`<tr><td>${rname(r)}<div class="meter ${okr?"":"ng"}"><i style="width:${m?p/m*100:0}%"></i><b></b></div></td><td class="r">${c}/${n}</td><td class="r"><span class="${okr?"ok":"ng"}">${p}</span><small>/${m}</small></td></tr>`;
    });
    h+=`</table>`;
    const hist=store("eisei-hist-"+id)||[];
    if(hist.length>1)h+=`<h2>これまでの得点</h2><div class="hist">${hist.slice(-8).map(x=>`<span>${md(x.at)}　${x.pts}点</span>`).join("")}</div>`;
  }
  h+=`<div class="row" style="margin-top:16px">`;
  const nk=noteKeys();
  if(nk.length)h+=`<button data-go="review">まちがいだけ解き直す（${nk.length}問）</button>`;
  if(id!=="review")h+=`<button class="sub" data-go="${id}">もう一度最初から</button>`;
  h+=`<a class="btn sub" href="#/">一覧へ</a></div>`;
  const card=it=>{
    const v=res.ans[it.key], good=v===it.q.a;
    return `<div class="wrong"><span class="tag">${esc(it.label)}　${rname(it.q.r)}</span><span>${esc(it.q.q)}</span>
    ${good?"":`<span class="you">あなたの答え：${v===null||v===undefined?"（空欄）":esc(it.q.c[v])}</span>`}
    <span class="ans">正解：${esc(it.q.c[it.q.a])}</span>${it.q.e?`<span class="exp"><b>解説</b>　${esc(it.q.e)}</span>`:""}</div>`;
  };
  if(res.wrong.length){h+=`<h2>まちがえた問題<span>${res.wrong.length}問</span></h2>`;res.wrong.forEach(k=>{if(byKey[k])h+=card(byKey[k])})}
  const right=items.filter(it=>!res.wrong.includes(it.key));
  if(right.length)h+=`<details><summary>正解した問題の解説も見る（${right.length}問）</summary>${right.map(card).join("")}</details>`;
  app.innerHTML=h;
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{store("eisei-draft-"+b.dataset.go,null);location.hash="#/q/"+b.dataset.go});
}

(async()=>{
  try{SETS=(await getJSON("sets.json")).sets}catch(e){app.innerHTML='<p class="center">読みこめませんでした。電波のいい所で開き直してください。</p>';return}
  route();
})();
</script>
