<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>今日の5教科ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Dela+Gothic+One&display=swap">
<style>
:root{
  --ground:#F2F5F1; --surface:#FFFFFF; --ink:#1E2723; --muted:#5C6964; --line:#D6DDD8;
  --accent:#2F6A52; --accent-ink:#FFFFFF; --accent-soft:#E2EEE7;
  --ok:#2F6A52; --ng:#B0452C; --ng-soft:#F7E6E0;
  --body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --display:"Dela Gothic One","BIZ UDPGothic","Hiragino Sans",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#121815; --surface:#1B2320; --ink:#E4EBE7; --muted:#98A69F; --line:#2E3934;
    --accent:#72C09B; --accent-ink:#0E1512; --accent-soft:#1F3229;
    --ok:#72C09B; --ng:#E88A70; --ng-soft:#3A2520; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#121815; --surface:#1B2320; --ink:#E4EBE7; --muted:#98A69F; --line:#2E3934;
  --accent:#72C09B; --accent-ink:#0E1512; --accent-soft:#1F3229;
  --ok:#72C09B; --ng:#E88A70; --ng-soft:#3A2520; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;padding:0 16px}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 120px}
header{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
h1{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.3;margin:0;text-wrap:balance}
.rule{font-size:14px;color:var(--muted);margin:0}
.rule b{color:var(--ink)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);display:flex;gap:6px;padding-block:10px;overflow-x:auto;margin:0 -16px;padding-inline:16px}
nav a{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);text-decoration:none;font-weight:700;font-size:15px;line-height:1.3;min-width:58px}
nav a small{font-weight:400;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
nav a.done{border-color:var(--accent);background:var(--accent-soft)}
section{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 70px);margin-top:18px}
h2{font-size:18px;margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
h2 span{font-size:12px;color:var(--muted);font-weight:400}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.qhead{display:flex;gap:10px;align-items:flex-start}
.num{font-family:var(--display);font-size:15px;color:var(--accent);min-width:28px;font-variant-numeric:tabular-nums}
.qtext{margin:0;flex:1}
.kind{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px;white-space:nowrap}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:420px){.choices{grid-template-columns:1fr}}
.choices label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--ground)}
.choices input{accent-color:var(--accent);width:18px;height:18px;flex:none}
.choices label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choices label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
input[type=text]{width:100%;font:inherit;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--ground);color:var(--ink)}
input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:10}
.bar-in{max-width:640px;margin:0 auto;display:flex;gap:12px;align-items:center}
.count{flex:1;font-size:14px;color:var(--muted);line-height:1.4}
.count b{font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
button{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:10px;padding:12px 20px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.warn{background:var(--ng);color:#fff}
.msg{font-size:13px;color:var(--ng);margin:0}
/* result */
.result{display:flex;flex-direction:column;gap:14px}
.scorecard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.score{font-family:var(--display);font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:22px;color:var(--muted)}
.verdict{font-weight:700;font-size:18px;padding:4px 12px;border-radius:999px}
.verdict.pass{background:var(--accent-soft);color:var(--ok)}
.verdict.fail{background:var(--ng-soft);color:var(--ng)}
.stamp{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.subjects{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.subj{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;line-height:1.3}
.subj b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.subj small{font-size:12px;color:var(--muted)}
.wrong{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.wrong .tag{font-size:12px;color:var(--muted)}
.wrong .you{color:var(--ng);font-size:14px}
.wrong .ans{color:var(--ok);font-weight:700;font-size:14px}
.center{padding:40px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
html{scroll-behavior:smooth}
</style>
</head>
<body>

<div class="wrap" id="app"><p class="center">問題を読みこんでいます…</p></div>
<div class="bar" id="bar" hidden>
  <div class="bar-in">
    <div class="count"><b id="cnt">0</b> / 50 問 回答<br><span id="hint">全部答えたら採点しよう</span></div>
    <button id="grade" type="button">採点する</button>
  </div>
</div>

<script>
const SUBJ=["国語","数学","英語","理科","社会"];
const app=document.getElementById("app"), bar=document.getElementById("bar");
let data=null, answers={}, armed=false;

function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function rng(seed){let h=2166136261;for(const ch of seed){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%10000)/10000}}
function order(i,n){const r=rng(data.date+"#"+i),a=[...Array(n).keys()];for(let k=n-1;k>0;k--){const j=Math.floor(r()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function norm(s){return String(s).normalize("NFKC").trim().toLowerCase().replace(/[\s。．.、,]/g,"")}
function numNorm(s){return norm(s).replace(/[−–―‐ー]/g,"-")}
function correct(q,i){
  const v=answers[i]; if(v===undefined||v==="")return false;
  if(q.t==="c")return Number(v)===q.a;
  return q.a.some(a=>norm(a)===norm(v)||numNorm(a)===numNorm(v));
}
function fmtDate(d){const [y,m,dd]=d.split("-").map(Number);const w="日月火水木金土"[new Date(y,m-1,dd).getDay()];return `${m}月${dd}日（${w}）`}

async function load(){
  try{
    const r=await fetch("questions.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw 0; data=await r.json();
  }catch(e){app.innerHTML='<p class="center">問題を読みこめませんでした。電波のいい所でページを開き直してください。</p>';return}
  const done=store("result-"+(data.id||data.date));
  if(done){renderResult(done);return}
  answers=store("draft-"+(data.id||data.date))||{};
  renderQuiz();
}

function renderQuiz(){
  let html=`<header><span class="eyebrow">${fmtDate(data.date)}のドリル</span><h1>5教科 50問チャレンジ</h1>
  <p class="rule"><b>${data.pass}問以上</b>正解で、今日のスマホは3時間。採点は1日1回だけです。</p></header><nav id="nav">`;
  SUBJ.forEach((s,k)=>html+=`<a href="#s${k}" data-s="${s}">${s}<small>0/10</small></a>`);
  html+="</nav>";
  let n=0;
  SUBJ.forEach((s,k)=>{
    const qs=data.questions.map((q,i)=>[q,i]).filter(([q])=>q.s===s);
    html+=`<section id="s${k}"><h2>${s}<span>${qs.length}問</span></h2>`;
    qs.forEach(([q,i])=>{
      n++;
      html+=`<div class="q"><div class="qhead"><span class="num">${n}</span><p class="qtext">${esc(q.q)}</p><span class="kind">${q.t==="c"?"選択":"記述"}</span></div>`;
      if(q.t==="c"){
        html+='<div class="choices">';
        order(i,q.c.length).forEach(ci=>{
          html+=`<label><input type="radio" name="q${i}" id="q${i}_${ci}" value="${ci}" ${String(answers[i])===String(ci)?"checked":""}>${esc(q.c[ci])}</label>`;
        });
        html+="</div>";
      }else{
        html+=`<input type="text" id="q${i}" data-i="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="答えを入力" value="${esc(answers[i]||"")}">`;
      }
      html+="</div>";
    });
    html+="</section>";
  });
  app.innerHTML=html; bar.hidden=false;
  const onEdit=e=>{
    const t=e.target;
    if(t.type==="radio")answers[t.name.slice(1)]=t.value;
    else if(t.dataset.i)answers[t.dataset.i]=t.value;
    else return;
    store("draft-"+(data.id||data.date),answers); disarm(); update();
  };
  app.addEventListener("input",onEdit); app.addEventListener("change",onEdit);
  update();
}
function answered(i){const v=answers[i];return v!==undefined&&String(v).trim()!==""}
function update(){
  let total=0;
  SUBJ.forEach(s=>{
    const idx=data.questions.map((q,i)=>i).filter(i=>data.questions[i].s===s);
    const c=idx.filter(answered).length; total+=c;
    const a=document.querySelector(`nav a[data-s="${s}"]`);
    if(a){a.querySelector("small").textContent=`${c}/${idx.length}`;a.classList.toggle("done",c===idx.length)}
  });
  document.getElementById("cnt").textContent=total;
  return total;
}
function disarm(){armed=false;const b=document.getElementById("grade");b.textContent="採点する";b.classList.remove("warn");document.getElementById("hint").textContent="全部答えたら採点しよう"}
document.getElementById("grade").addEventListener("click",()=>{
  const total=update(), left=data.questions.length-total, b=document.getElementById("grade"), h=document.getElementById("hint");
  if(!armed){armed=true;b.textContent="本当に採点";b.classList.add("warn");
    h.textContent=left>0?`まだ${left}問が空欄。採点後は直せません`:"採点後は答えを直せません";return}
  const per={}; let score=0; const wrong=[];
  SUBJ.forEach(s=>per[s]=[0,0]);
  data.questions.forEach((q,i)=>{
    const ok=correct(q,i); per[q.s][1]++; if(ok){per[q.s][0]++;score++}
    else wrong.push({s:q.s,q:q.q,you:answered(i)?(q.t==="c"?q.c[answers[i]]:answers[i]):"（空欄）",ans:q.t==="c"?q.c[q.a]:q.a[0]});
  });
  const res={date:data.date,score,total:data.questions.length,pass:data.pass,per,wrong,at:new Date().toISOString()};
  store("result-"+(data.id||data.date),res);
  renderResult(res); window.scrollTo(0,0);
});

function renderResult(r){
  bar.hidden=true;
  const ok=r.score>=r.pass, t=new Date(r.at);
  const stamp=`${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")} に採点`;
  let html=`<div class="result"><header><span class="eyebrow">${fmtDate(r.date)}のドリル 結果</span></header>
  <div class="scorecard"><div class="score">${r.score}<small> / ${r.total}</small></div>
  <span class="verdict ${ok?"pass":"fail"}">${ok?"合格　今日のスマホは3時間OK":`あと${r.pass-r.score}問　今日は1時間`}</span>
  <span class="stamp">合格ライン ${r.pass}問　・　${stamp}</span></div>
  <p class="rule">この画面をおうちの人に見せてください。</p>
  <div class="subjects">`;
  SUBJ.forEach(s=>{const [c,n]=r.per[s]||[0,0];html+=`<div class="subj"><small>${s}</small><b>${c}</b><small>/ ${n}</small></div>`});
  html+="</div>";
  if(r.wrong.length){
    html+=`<h2>まちがえた問題<span>${r.wrong.length}問</span></h2>`;
    r.wrong.forEach(w=>html+=`<div class="wrong"><span class="tag">${w.s}</span><span>${esc(w.q)}</span><span class="you">きみの答え：${esc(w.you)}</span><span class="ans">正解：${esc(w.ans)}</span></div>`);
  }
  html+=`<p class="rule">明日の朝、新しい50問に変わります。</p></div>`;
  app.innerHTML=html;
}
load();
</script>
</body>
</html>
